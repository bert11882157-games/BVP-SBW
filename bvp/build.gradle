import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.util.zip.ZipFile

plugins {
    id 'java'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// The export uses local sources; development selects its canonical source root explicitly.
def canonicalJava = file(providers.gradleProperty('bvpSourceRoot').getOrElse('src/main/java'))
def inputsFile = file(providers.gradleProperty('sbwBuildInputs').getOrElse('build/source-build/inputs.json'))
def namedJava = layout.buildDirectory.dir('generated/sources/named')
def sha256 = { File f ->
    def digest = MessageDigest.getInstance('SHA-256')
    f.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        for (int n = stream.read(buffer); n != -1; n = stream.read(buffer)) digest.update(buffer, 0, n)
    }
    digest.digest().encodeHex().toString()
}
def compilerFiles = providers.provider {
    if (!inputsFile.isFile()) throw new GradleException(
        'Missing matching SBW source-build inputs. Run node build-support/build-release.mjs --tree <export> --meshloader-manifest <JSON>.')
    def data = new JsonSlurper().parse(inputsFile)
    if (data.schema != 1 || data.kind != 'sbw-source-compiler-inputs') throw new GradleException('Unsupported SBW bridge schema')
    if (data.minecraft != minecraft_version) throw new GradleException('SBW/BVP Minecraft versions differ')
    (data.classpath + [data.mappedApi, data.meshloader]).collect { row ->
        File f = new File(row.path)
        if (!f.isFile() || f.length() != row.size || sha256(f) != row.sha256) {
            throw new GradleException("Changed or missing source-build dependency: ${row.id}")
        }
        f
    }
}

sourceSets.main {
    java.setSrcDirs([namedJava])
    // First wins: source-owned overlay overrides stale generated mirrors.
    resources.setSrcDirs(['src/main/resources', 'src/generated/resources'])
    compileClasspath = files(compilerFiles)
}
tasks.register('prepareNamedSources', Exec) {
    inputs.dir(canonicalJava)
    inputs.file(inputsFile)
    inputs.file('build-support/remap-sources.mjs')
    outputs.dir(namedJava)
    commandLine providers.gradleProperty('nodeExecutable').getOrElse('node'),
        file('build-support/remap-sources.mjs'), '--source', canonicalJava,
        '--inputs', inputsFile, '--output', namedJava.get().asFile
}
tasks.named('compileJava', JavaCompile) { dependsOn('prepareNamedSources') }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-proc:none']
}
tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude('META-INF/MANIFEST.MF', '.cache/**')
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar', Jar) {
    archiveClassifier = 'mapped'
    manifest.attributes([
        'MixinConfigs': 'berts_vehicle_pack.mixins.json',
        'Specification-Title': mod_id,
        'Specification-Vendor': mod_authors,
        'Specification-Version': '1',
        'Implementation-Title': mod_id,
        'Implementation-Version': mod_version,
        'Implementation-Vendor': mod_authors
    ])
}
tasks.register('verifyStaticResources') {
    dependsOn('jar')
    doLast {
        def source = file('src/main/resources')
        def resources = fileTree(source).files.sort { it.path }
        if (resources.empty) throw new GradleException('Source-owned resource overlay is empty')
        def candidate = providers.gradleProperty('staticJar').isPresent()
            ? file(providers.gradleProperty('staticJar').get())
            : tasks.named('jar', Jar).get().archiveFile.get().asFile
        def archive = new ZipFile(candidate)
        try {
            resources.each { f ->
                def name = source.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                def entry = archive.getEntry(name)
                if (entry == null) throw new GradleException("Missing static resource: $name")
                def digest = MessageDigest.getInstance('SHA-256')
                archive.getInputStream(entry).withCloseable { stream ->
                    byte[] buffer = new byte[65536]
                    for (int n = stream.read(buffer); n != -1; n = stream.read(buffer)) digest.update(buffer, 0, n)
                }
                if (digest.digest().encodeHex().toString() != sha256(f)) throw new GradleException("Changed static resource: $name")
            }
        } finally { archive.close() }
        println "PASS BVP source-owned static resources: ${resources.size()} exact files"
    }
}

// *-mapped.jar is development-only. build-release.mjs remaps it to the runtime artifact.
